apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: mc-router
  name: mc-router
  namespace: games
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resourceNames:
  - minecraft
  resources:
  - statefulsets
  - statefulsets/scale
  verbs:
  - get
  - update
  - patch
