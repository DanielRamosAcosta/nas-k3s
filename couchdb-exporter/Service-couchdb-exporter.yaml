apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "9984"
    prometheus.io/scrape: "true"
  labels:
    app: couchdb-exporter
    name: couchdb-exporter
  name: couchdb-exporter
  namespace: databases
spec:
  ports:
  - name: couchdb-exporter-metrics
    port: 9984
    targetPort: 9984
  selector:
    name: couchdb-exporter
