apiVersion: v1
data:
  postgres.create-monitoring-user.sh: "#!/usr/bin/env bash\nset -euo pipefail\n\necho
    \"\U0001F3D7️  Creando rol de monitoring, BBDD 'monitoring' y tabla backup_log...\"\n\n#
    Validar variables requeridas\n: \"${USER_PASSWORD:?Variable USER_PASSWORD es requerida}\"\n:
    \"${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD es requerida}\"\n\n# Configuración
    de conexión (con valores por defecto)\nPOSTGRES_HOST=\"${POSTGRES_HOST:-postgres.databases.svc.cluster.local}\"\nPOSTGRES_PORT=\"5432\"\nPOSTGRES_USER=\"${POSTGRES_USER:-postgres}\"\n\necho
    \"\U0001F510 Creando rol 'monitoring' y aplicando GRANT pg_monitor...\"\n\n# Rol
    de solo-monitoring (pg_monitor da acceso a las vistas pg_stat_* sin más privilegios).\nPGPASSWORD=\"$POSTGRES_PASSWORD\"
    psql -h \"$POSTGRES_HOST\" -p \"$POSTGRES_PORT\" -U \"$POSTGRES_USER\" -v ON_ERROR_STOP=1
    <<SQL\nDO \\$\\$\nBEGIN\n    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname
    = 'monitoring') THEN\n        CREATE ROLE monitoring LOGIN PASSWORD '$USER_PASSWORD';\n
    \       RAISE NOTICE 'Rol monitoring creado exitosamente';\n    ELSE\n        RAISE
    NOTICE 'Rol monitoring ya existe';\n    END IF;\nEND\n\\$\\$;\nGRANT pg_monitor
    TO monitoring;\nSQL\n\n# CREATE DATABASE no puede ir dentro de un bloque DO/transacción:
    usar \\gexec.\necho \"\U0001F4E6 Creando BBDD 'monitoring' (owner monitoring)
    si no existe...\"\nPGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h \"$POSTGRES_HOST\"
    -p \"$POSTGRES_PORT\" -U \"$POSTGRES_USER\" -v ON_ERROR_STOP=1 <<SQL\nSELECT 'CREATE
    DATABASE monitoring OWNER monitoring'\nWHERE NOT EXISTS (SELECT 1 FROM pg_database
    WHERE datname = 'monitoring')\\gexec\nSQL\n\n# Reconectar a la BBDD 'monitoring'
    para crear la tabla marcador de frescura de backups.\necho \"\U0001F527 Creando
    tabla backup_log en la BBDD 'monitoring'...\"\nPGPASSWORD=\"$POSTGRES_PASSWORD\"
    psql -h \"$POSTGRES_HOST\" -p \"$POSTGRES_PORT\" -U \"$POSTGRES_USER\" -d monitoring
    -v ON_ERROR_STOP=1 <<'SQL'\nCREATE TABLE IF NOT EXISTS public.backup_log (\n    db
    \         text PRIMARY KEY,\n    finished_at timestamptz NOT NULL\n);\nGRANT SELECT
    ON public.backup_log TO monitoring;\nSQL\n\necho \"✅  Rol 'monitoring', BBDD 'monitoring'
    y tabla backup_log listos.\"\n"
kind: ConfigMap
metadata:
  labels:
    app: postgres
  name: postgres-create-monitoring-user-sh
  namespace: databases
