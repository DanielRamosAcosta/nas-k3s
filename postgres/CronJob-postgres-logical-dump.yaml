apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: postgres
  name: postgres-logical-dump
  namespace: databases
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            name: postgres-logical-dump
        spec:
          containers:
          - command:
            - /bin/bash
            - /mnt/scripts/postgres.dump.sh
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: PGPASSWORD
                  name: postgres-backup-sealed-secret
            image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3-pgvector0.8.0-pgvectors0.3.0
            imagePullPolicy: IfNotPresent
            name: dump
            volumeMounts:
            - mountPath: /backups
              name: backup-storage
            - mountPath: /mnt/scripts/postgres.dump.sh
              name: postgres-dump-sh
              subPath: postgres.dump.sh
          restartPolicy: OnFailure
          volumes:
          - hostPath:
              path: /cold-data/postgres-backups
            name: backup-storage
          - configMap:
              name: postgres-dump-sh
            name: postgres-dump-sh
  schedule: 0 1 * * *
  successfulJobsHistoryLimit: 3
