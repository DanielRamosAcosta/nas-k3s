apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8428"
    prometheus.io/scrape: "true"
  labels:
    app: victoriametrics
    name: victoriametrics
  name: victoriametrics
  namespace: monitoring
spec:
  ports:
  - name: victoriametrics-http
    port: 8428
    targetPort: 8428
  selector:
    name: victoriametrics
