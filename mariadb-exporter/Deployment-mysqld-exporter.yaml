apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mariadb-exporter
  name: mysqld-exporter
  namespace: databases
spec:
  minReadySeconds: 10
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: mysqld-exporter
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        name: mysqld-exporter
    spec:
      containers:
      - args:
        - --config.my-cnf=/etc/mysqld-exporter/my.cnf
        image: quay.io/prometheus/mysqld-exporter:v0.20.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 9104
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        name: mysqld-exporter
        ports:
        - containerPort: 9104
          name: metrics
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 9104
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /etc/mysqld-exporter/my.cnf
          name: my-cnf-sealed-secret
          subPath: my.cnf
      volumes:
      - name: my-cnf-sealed-secret
        secret:
          defaultMode: 384
          secretName: my-cnf-sealed-secret
