apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "9121"
    prometheus.io/scrape: "true"
  labels:
    app: valkey-exporter
    name: redis-exporter
  name: redis-exporter
  namespace: databases
spec:
  ports:
  - name: redis-exporter-metrics
    port: 9121
    targetPort: 9121
  selector:
    name: redis-exporter
