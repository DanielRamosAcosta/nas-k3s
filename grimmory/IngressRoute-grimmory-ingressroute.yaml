apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app: grimmory
  name: grimmory-ingressroute
  namespace: media
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`books.danielramos.me`)
    services:
    - name: grimmory
      port: 6060
  tls:
    store:
      name: default
