apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grimmory
  name: grimmory
  namespace: media
spec:
  minReadySeconds: 10
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: grimmory
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        name: grimmory
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              key: DATABASE_URL
              name: grimmory-config-env
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              key: DATABASE_USERNAME
              name: grimmory-config-env
        - name: GROUP_ID
          valueFrom:
            configMapKeyRef:
              key: GROUP_ID
              name: grimmory-config-env
        - name: LOGGING_CONFIG
          valueFrom:
            configMapKeyRef:
              key: LOGGING_CONFIG
              name: grimmory-config-env
        - name: TZ
          valueFrom:
            configMapKeyRef:
              key: TZ
              name: grimmory-config-env
        - name: USER_ID
          valueFrom:
            configMapKeyRef:
              key: USER_ID
              name: grimmory-config-env
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: grimmory-shared-sealed-secret
        image: grimmory/grimmory:v3.3.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/v1/healthcheck
            port: 6060
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        name: grimmory
        ports:
        - containerPort: 6060
          name: server
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/v1/healthcheck
            port: 6060
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /api/v1/healthcheck
            port: 6060
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /app/data
          name: data
        - mountPath: /books
          name: books
        - mountPath: /bookdrop
          name: bookdrop
        - mountPath: /config/logback-spring.xml
          name: logback-spring-xml
          subPath: logback-spring.xml
      volumes:
      - hostPath:
          path: /cold-data/grimmory/data
        name: data
      - hostPath:
          path: /cold-data/grimmory/books
        name: books
      - hostPath:
          path: /cold-data/grimmory/bookdrop
        name: bookdrop
      - configMap:
          name: logback-spring-xml
        name: logback-spring-xml
