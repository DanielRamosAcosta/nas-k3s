apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "9187"
    prometheus.io/scrape: "true"
  labels:
    app: postgres-exporter
    name: postgres-exporter
  name: postgres-exporter
  namespace: databases
spec:
  ports:
  - name: postgres-exporter-metrics
    port: 9187
    targetPort: 9187
  selector:
    name: postgres-exporter
