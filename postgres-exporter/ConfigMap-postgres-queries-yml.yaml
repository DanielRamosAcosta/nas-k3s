apiVersion: v1
data:
  postgres-queries.yml: |
    # Custom queries para postgres-exporter v0.20.1 (flag deprecado pero vigente
    # --extend.query-path / PG_EXPORTER_EXTEND_QUERY_PATH). El nombre final de la
    # métrica es <clave_top_level>_<columna>; las columnas LABEL pasan a etiquetas.

    # Tamaño por BBDD (descubrimiento dinámico: cualquier BBDD nueva entra sola).
    # -> pg_database_size_bytes{datname="..."}
    pg_database:
      query: "SELECT datname, pg_database_size(datname) AS size_bytes FROM pg_database WHERE NOT datistemplate"
      master: true
      metrics:
        - datname:
            usage: "LABEL"
            description: "Nombre de la base de datos"
        - size_bytes:
            usage: "GAUGE"
            description: "Tamaño de la base de datos en bytes"

    # Frescura del último dump lógico por BBDD (tabla marcador backup_log).
    # -> pg_backup_last_backup_epoch{db="..."}
    pg_backup:
      query: "SELECT db, extract(epoch FROM finished_at) AS last_backup_epoch FROM backup_log"
      master: true
      metrics:
        - db:
            usage: "LABEL"
            description: "Nombre de la base de datos respaldada"
        - last_backup_epoch:
            usage: "GAUGE"
            description: "Epoch (segundos UTC) del último dump lógico completado"
kind: ConfigMap
metadata:
  labels:
    app: postgres-exporter
  name: postgres-queries-yml
  namespace: databases
