apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "7100"
    prometheus.io/scrape: "true"
  labels:
    app: scraparr
    name: scraparr
  name: scraparr
  namespace: monitoring
spec:
  ports:
  - name: scraparr-metrics
    port: 7100
    targetPort: 7100
  selector:
    name: scraparr
