apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "3000"
    prometheus.io/scrape: "true"
  labels:
    app: grafana
    name: grafana
  name: grafana
  namespace: monitoring
spec:
  ports:
  - name: grafana-http
    port: 3000
    targetPort: 3000
  selector:
    name: grafana
