# Custom queries para postgres-exporter v0.20.1 (flag deprecado pero vigente
# --extend.query-path / PG_EXPORTER_EXTEND_QUERY_PATH). El nombre final de la
# métrica es <clave_top_level>_<columna>; las columnas LABEL pasan a etiquetas.
#
# NOTA: el tamaño por BBDD NO se define aquí. El colector BUILT-IN del exporter
# ya emite pg_database_size_bytes{datname="..."}; duplicarlo con una custom query
# provoca una colisión de nombre/help que hace fallar TODO /metrics con HTTP 500.

# Frescura del último dump lógico por BBDD (tabla marcador backup_log). No tiene
# equivalente built-in. -> pg_backup_last_backup_epoch{db="..."}
pg_backup:
  query: "SELECT db, extract(epoch FROM finished_at) AS last_backup_epoch FROM backup_log"
  master: true
  metrics:
    - db:
        usage: "LABEL"
        description: "Nombre de la base de datos respaldada"
    - last_backup_epoch:
        usage: "GAUGE"
        description: "Epoch (segundos UTC) del último dump lógico completado"
